# Minimal waypoint-tracking mission configuration.
#
# Each task specifies a goal pose on the map. The robot tracks that goal pose
# using the onboard localization estimate and waypoint controller.

frame: global

map:
  resolution: 0.1
  boundary:
    - {x: 0.0, y: 0.0}
    - {x: 4.72, y: 0.0}
    - {x: 4.72, y: 3.545}
    - {x: 0.0, y: 3.545}
  landmarks:
    - name: left_tag_table
      id: 5
      position: {x: 0.315, y: 0.59}
      heading: 0.0
    - name: right_tag_table
      id: 6
      position: {x: 0.315, y: 1.175}
      heading: 0.0
    - name: ramp_tag_1
      id: 4
      position: {x: 1.2725, y: 1.99}
      heading: -1.57
    - name: ramp_tag_2
      id: 3
      position: {x: 2.0575, y: 2.8525}
      heading: 0.0
    - name: dishwasher_tag
      id: 8
      position: {x: 3.9725, y: 0.3625}
      heading: 1.57
    - name: table_back_right
      id: 7
      position: {x: 4.655, y: 1.53}
      heading: 3.14
    - name: table_tray
      id: 1
      position: {x: 3.57, y: 2.565}
      heading: 0.0
    - name: table_back_left
      id: 2
      position: {x: 3.855, y: 2.865}
      heading: 3.14
    - name: back_wall
      id: 0
      position: {x: 2.595, y: 3.545}
      heading: -1.57
    - name: front_wall
      id: 9
      position: {x: 0.97, y: 0.06}
      heading: 1.57
  obstacles: []

initial_state:
  position: {x: 0.8, y: 1.18}
  heading: 3.14

mission_runtime:
  control_rate_hz: 15.0
  # Match the 3 rad/s wheel-command limit with 0.06 m wheel radius:
  # max feasible side command magnitude is 0.18 m/s.
  controller_v_max: 0.18
  controller_omega_max: 0.18
  tag_distance_kp: 0.8
  tag_center_kp: 1.2
  search_omega_rad_s: 0.35
  align_only_center_error_px: 120.0
  default_distance_tolerance_m: 0.08
  default_center_tolerance_px: 40.0
  default_settle_time_s: 0.3
  person_detection_period_s: 0.5
  obstacle_stop_forward_m: 1.2
  obstacle_stop_lateral_m: 0.5

# Ordered FSM tasks.
tasks:
  - name: pickup_tray
    desired_elevator_height_m: 0.0
    goal:
      position: {x: 0.315, y: 0.59}
      heading: 0.0
    completion_conditions:
      - task_elapsed_s >= 2.0

  - name: deliver_tray
    desired_elevator_height_m: 0.0
    goal:
      position: {x: 2.0575, y: 2.8525}
      heading: 0.0
    completion_conditions:
      - task_elapsed_s >= 1.0
