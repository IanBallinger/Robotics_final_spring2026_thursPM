camera_to_robot:
  # Camera pose expressed in the robot/body frame.
  # Keep this as the single source of truth for mobile-robot camera extrinsics.
  translation:
    x: 0.0
    y: 0.0
    z: 0.0
  rotation_rpy:
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

camera_to_arm:
  # Camera pose expressed in the 2-link arm base frame.
  # Use this for transforming tray points from the camera optical frame
  # into the manipulator base frame.
  translation:
    x: 0.0
    y: 0.0
    z: 0.0
  rotation_rpy:
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

